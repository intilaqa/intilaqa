<title>انطلاقة باحث المستقبل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--acc:#c48a00;--accs:#fff5dc;--navy:#1c3768;--ink:#2b3a4a;--muted:#6b7a8c;--line:#e6ebf2;--bg:#f7fafd;--ok:#3e8c00;--oks:#eaf6db;--late:#c0392b;--lates:#fdecea;--doing:#1b5fae;--doings:#e6f1fc}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:15px}
header{background:#fff;border-bottom:1px solid var(--line)}
.hd{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 18px}
.hd img{height:42px}.hd .c img{height:50px}.hd .l{justify-self:end}
.band{height:5px;background:var(--acc)}
.who{max-width:1000px;margin:18px auto 0;padding:0 18px;display:flex;align-items:center;gap:14px}
.who .av{width:52px;height:52px;border-radius:50%;background:var(--accs);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.who h1{margin:0;font-size:22px;color:var(--navy)}
.who p{margin:0;color:var(--muted);font-size:14px}
nav{max-width:1000px;margin:14px auto 0;padding:0 18px;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:22px;padding:7px 16px;cursor:pointer;font-weight:700}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px 18px 60px}
h2{font-size:18px;color:var(--navy);margin:22px 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.task{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.task .t{font-weight:700}
.task .m{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button.on[data-k=todo],.seg button.on[data-s=todo]{background:#eef1f5;color:var(--ink)}
.seg button.on[data-k=doing],.seg button.on[data-s=doing]{background:var(--doings);color:var(--doing)}
.seg button.on[data-k=done],.seg button.on[data-s=done]{background:var(--oks);color:var(--ok)}
.tag{display:inline-block;font-size:12px;border-radius:12px;padding:1px 9px;margin-inline-start:6px}
.tag.late{background:var(--lates);color:var(--late)}.tag.soon{background:#fff6df;color:#9a6a00}.tag.done{background:var(--oks);color:var(--ok)}
.more{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.more input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fbfcfe}
.btn{border:0;border-radius:10px;padding:9px 16px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
.btn.light{background:var(--accs);color:var(--acc)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.red{background:#fff;color:var(--late);border:1px solid #f1c4bf}
.big{display:block;width:100%;padding:16px;font-size:18px;border-radius:14px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}.task{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}
.stations{display:flex;gap:4px;margin-top:6px}.stations span{flex:1;height:7px;border-radius:4px;background:#eef2f7}.stations span.on{background:var(--acc)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.sum{grid-template-columns:1fr 1fr}}
.sum .s{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sum .s b{display:block;font-size:24px;color:var(--navy)}
.sum .s span{font-size:13px;color:var(--muted)}
.bar{height:7px;background:#eef2f7;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.note{background:var(--accs);border-radius:12px;padding:10px 14px;font-size:14px;margin:10px 0}
.warnb{background:#fff6df;color:#7a5600}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th{background:#f3f6fa;color:var(--navy);text-align:right;padding:9px 10px;font-weight:700}
td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:middle}
td input,td select{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.ev{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ev:last-child{border:0}
.drop{border:2px dashed var(--acc);border-radius:12px;padding:14px;text-align:center;background:var(--accs);color:var(--navy);margin-top:8px}
.hide{display:none!important}
.mem{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:8px;vertical-align:middle}
.log{font-size:14px;background:var(--oks);color:#2f5a00;border-radius:12px;padding:10px 14px;margin-top:10px;white-space:pre-line}
.kprow{display:grid;grid-template-columns:110px 1fr 90px 90px 30px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kprow:last-child{border:0}
.kprow input{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px;text-align:center}
.kprow .cd{direction:ltr;text-align:right;font-weight:700;color:var(--navy)}
@media(max-width:700px){.kprow{grid-template-columns:1fr 70px 70px 24px}.kprow .cd{grid-column:1/-1}}
.modal{position:fixed;inset:0;background:rgba(20,30,50,.35);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}.mbox{background:#fff;border-radius:16px;padding:18px;max-width:460px;width:100%}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hello{background:linear-gradient(120deg,var(--accs),#fff);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:12px}
.hello h2{margin:0 0 4px;font-size:21px}
.hello .q{color:var(--muted);font-size:15px}
.lvl{background:#fff;border:2px solid var(--acc);color:var(--acc);border-radius:16px;padding:8px 14px;text-align:center;font-weight:800;font-size:15px;min-width:120px}
.lvl small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.joke{font-size:12px;color:#a0522d;margin-top:2px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#fff;border:2px solid var(--acc);color:var(--navy);padding:12px 20px;border-radius:30px;box-shadow:0 10px 30px rgba(28,55,104,.18);font-weight:700;font-size:16px;opacity:0;transition:.35s;z-index:20;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:19}
.stu{border-inline-start:5px solid var(--acc)}
.stu .head{display:grid;grid-template-columns:2fr 2fr 1fr 1fr auto;gap:8px;align-items:end}
@media(max-width:700px){.stu .head{grid-template-columns:1fr 1fr}}
.stt{display:grid;grid-template-columns:1fr 150px auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.stt:last-child{border:0}
.stt input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
@media(max-width:700px){.stt{grid-template-columns:1fr 1fr}}
.badge{display:inline-block;background:#fff6df;color:#8a5a00;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:700;margin-inline-start:6px}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 85% 0%,#2a4d86 0%,#1c3768 55%,#152a52 100%);color:#fff;border-radius:26px;padding:20px 20px 18px;margin-bottom:14px;box-shadow:0 14px 34px rgba(28,55,104,.22)}
.hero:before{content:"";position:absolute;width:220px;height:220px;left:-60px;bottom:-90px;background:radial-gradient(circle,rgba(0,163,196,.45),transparent 70%)}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
.hero .hi{font-size:15px;color:#c9d6ea}
.hero .pts{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:4px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.gauge{position:relative;width:min(260px,72vw);margin:6px auto 0}
.gauge svg{width:100%;display:block}
.gauge .v{position:absolute;inset:auto 0 4px 0;text-align:center;font-size:44px;font-weight:800;letter-spacing:-1px}
.gauge .v small{display:block;font-size:13px;font-weight:500;color:#c9d6ea;letter-spacing:0}
.mood{text-align:center;font-size:22px;font-weight:800;margin:8px 0 2px;position:relative}
.mood span{display:inline-block;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
.moodsub{text-align:center;color:#c9d6ea;font-size:13px;position:relative}
.chips2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;position:relative}
.chips2 span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:5px 12px;font-size:14px}
.chips2 span.lt{background:rgba(214,69,69,.25);border-color:rgba(255,160,160,.35)}
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tri{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px 8px 12px;text-align:center;position:relative;overflow:hidden}
.tri:before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--tc)}
.tri .e{font-size:30px;line-height:1.2}
.tri b{display:block;font-size:34px;font-weight:800;color:var(--tc);line-height:1.1}
.tri .g{font-size:12px;color:var(--muted)}
.tri .l{font-size:14px;color:var(--ink);font-weight:700}
.sec{display:flex;align-items:baseline;gap:8px;justify-content:space-between;flex-wrap:wrap;margin:20px 0 4px}
.sec h2{margin:0;font-size:21px}
.sec p{margin:0;color:var(--muted);font-size:13px}
.race{background:#fff;border:1px solid var(--line);border-radius:24px;padding:6px 16px}
.lane{padding:14px 0 12px;border-bottom:1px dashed var(--line)}
.lane:last-child{border:0}
.lane .nm{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lane .nm b{font-size:16px;color:var(--navy)}
.lane .st{font-size:13px;color:var(--muted)}
.track{position:relative;height:46px;margin:6px 6px 0}
.track .rail{position:absolute;top:30px;right:0;left:0;height:6px;border-radius:4px;background:#eef2f7}
.track .fill{position:absolute;top:30px;right:0;height:6px;border-radius:4px;background:linear-gradient(270deg,#2e7bd6,#00a3c4,#78b800);transition:width .6s}
.track .dot{position:absolute;top:24px;width:18px;height:18px;margin-right:-9px;border-radius:50%;background:#fff;border:3px solid #d5dde8}
.track .dot.on{background:#2e7bd6;border-color:#2e7bd6}
.track .dot.fin{border-radius:5px}
.track .rc{position:absolute;top:-2px;font-size:26px;margin-right:-15px;transition:right .6s;transform:scaleX(-1)}
.labels{display:grid;grid-template-columns:repeat(5,1fr);font-size:11.5px;color:var(--muted);text-align:center;margin-top:2px}
.labels span.on{color:var(--navy);font-weight:700}
.lane .ctl{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.lane .ctl button{width:42px;height:38px;border-radius:12px;border:1px solid var(--line);background:#f5f8fc;font-size:20px;font-weight:800;color:var(--navy);cursor:pointer}
.league{background:#fff;border:1px solid var(--line);border-radius:24px;padding:6px 14px}
.lg{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.lg:last-child{border:0}
.lg .md{font-size:24px;text-align:center}
.lg .n{font-weight:700;font-size:15px}
.lg .u{font-size:12px;color:var(--muted)}
.lg .b{height:8px;border-radius:5px;background:#eef2f7;overflow:hidden;margin-top:5px}.lg .b i{display:block;height:100%;border-radius:5px}
.lg .p{font-size:22px;font-weight:800;text-align:center;line-height:1}.lg .p small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.rules{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.kgrid{grid-template-columns:1fr 1fr}}
.kc{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px 12px 10px;text-align:center}
.kc .cd{direction:ltr;font-size:12px;font-weight:800;color:var(--navy);background:#eef2f9;border-radius:10px;padding:1px 8px;display:inline-block}
.kc .nm{font-size:12.5px;color:var(--ink);min-height:36px;margin:6px 0 2px;line-height:1.4}
.kc .ring{width:92px;margin:0 auto;position:relative}
.kc .ring svg{width:100%;display:block}
.kc .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--navy)}
.kc .vs{font-size:12px;color:var(--muted);margin-top:4px}
.kc .tr{font-weight:800}
.kc .in{display:flex;gap:6px;margin-top:6px}.kc .in input{width:100%;border:1px solid var(--line);border-radius:8px;padding:5px;text-align:center;font-size:13px}
@media(max-width:480px){.triad .tri b{font-size:28px}.tri .e{font-size:26px}}
@media(prefers-reduced-motion:reduce){.mood span,.track .rc,.track .fill{animation:none;transition:none}}
/* lighter look */

.mood{font-size:18px;margin-top:4px}.moodsub{display:none}

#whoName{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

body{background:#f7f9fc}

.rr .rt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.rr .rt b{color:#1c3768;font-size:15px;white-space:nowrap}.rr .rt span{font-size:14px}.rr .rt .wait{color:var(--muted);font-size:13px}
.rr .rm{font-size:12.5px;color:var(--muted);margin-top:3px}
.rr .rs{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.rr .dots{display:flex;gap:4px}.rr .dots span{width:22px;height:7px;border-radius:99px;background:#e6edf5}.rr .dots span.on{background:#00a3c4}
.rr .now{font-size:13px;color:#3d5370}
.rr .ctl{margin-inline-start:auto;display:flex;gap:6px}.rr .ctl button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 12px;font:inherit;font-size:13px;color:#1c3768;cursor:pointer}
.rr .ctl button[data-mv="1"]{background:#e8f6fa;border-color:#cdeef5}
.triad .tri{box-shadow:none}


#repOv{position:fixed;inset:0;z-index:50;background:#e9eef4;overflow:auto;padding:12px}
.rbar{display:flex;gap:8px;justify-content:center;margin-bottom:12px;position:sticky;top:0}.rbar .rcl{background:#fff;color:#1c3768;border:1px solid #cfd8e3}
.rpaper{background:#fff;max-width:794px;margin:0 auto;padding:28px 30px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.08);color:#22303f;font-size:14px;line-height:1.6}
.rhd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #1c3768;padding-bottom:10px}.rhd img{height:64px}.rhd img.c{height:68px}
.rpaper h1{text-align:center;color:#1c3768;font-size:22px;margin:16px 0 2px}.rsub{text-align:center;color:#5d6b7a;font-size:12px;margin-bottom:14px}
.rpaper table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px;border-radius:0}.rpaper th{background:#1c3768;color:#fff;padding:7px;border:1px solid #1c3768;text-align:center}.rpaper td{border:1px solid #cfd8e3;padding:7px;text-align:center}
.rpaper td.tl{text-align:right}.rpaper .ri td:first-child{background:#eef4fb;font-weight:700;color:#1c3768;width:32%;white-space:nowrap;text-align:right}.rpaper .ri td{text-align:right}
.rpaper h3{color:#1c3768;font-size:15px;margin:16px 0 4px}
.rtot{display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap}.rtot div{border:1px solid #cfd8e3;border-radius:10px;padding:8px 18px;text-align:center;min-width:130px}.rtot b{display:block;font-size:24px;color:#1c3768}.rtot span{font-size:12px;color:#5d6b7a}
.rsig{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.rsig div{line-height:2.3}.rsig b{color:#1c3768}
.rnote{font-size:11.5px;color:#5d6b7a;margin-top:18px;text-align:center}
@media print{html,body{background:#fff!important}body.rep>*:not(#repOv){display:none!important}#repOv{position:static;background:#fff;padding:0;overflow:visible}.noprint{display:none!important}.rpaper{box-shadow:none;max-width:none;padding:0;border-radius:0}@page{size:A4;margin:14mm}}


.sro .sh{display:flex;align-items:center;gap:10px}.sro .sav{font-size:26px;width:44px;height:44px;border-radius:14px;background:var(--accs);display:flex;align-items:center;justify-content:center;flex:none}
.sro .si{flex:1;min-width:0}.sro .si b{display:block;color:#1c3768}.sro .si small{color:var(--muted);font-size:12.5px}
.sro .sk{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.sro .sk span{font-size:12px;background:#f3f6fa;border-radius:99px;padding:2px 8px;white-space:nowrap}
.sro details{margin-top:8px}.sro summary{cursor:pointer;color:var(--acc);font-size:13.5px;font-weight:700}
.sg{margin-top:10px}.sg .gt{font-weight:800;color:#1c3768;font-size:13.5px;margin-bottom:4px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}.srow:last-child{border:0}
.mut{color:var(--muted);font-size:13px}.sa{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ny ul{margin:6px 0;padding-inline-start:20px;font-size:14px;line-height:1.9}.arch{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}

.mcard .mh2{display:flex;justify-content:space-between;align-items:center;gap:8px}.mcard .mh2 b{color:#1c3768;display:block}.mcard small{color:var(--muted);font-size:12.5px}.mcard .mb2{font-size:13px;color:var(--muted);margin-top:4px}
.mform{max-width:640px;max-height:none;margin:20px auto}.mgt{font-weight:800;color:#1c3768;margin:14px 0 6px}.chk{display:inline-flex;align-items:center;gap:6px;background:#f5f8fc;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13.5px}
.drow{display:grid;grid-template-columns:1fr 130px 130px 30px;gap:6px;margin-bottom:6px}.drow input,.drow select{border:1px solid #dfe6ef;border-radius:10px;padding:7px 8px;font:inherit;font-size:13.5px;min-width:0}
@media(max-width:600px){.drow{grid-template-columns:1fr 1fr}.drow input[data-dt]{grid-column:1/-1}}
/* ===== UI refresh ===== */
:root{--bg:#f5f8fc;--line:#e7edf4;--sh:0 1px 2px rgba(28,55,104,.04),0 6px 18px rgba(28,55,104,.06)}
html,body{background:var(--bg)}
header{box-shadow:0 1px 0 var(--line)}.hd{padding:8px 16px}.hd img{height:34px}.hd .c img{height:42px}
.band{height:3px;background:linear-gradient(90deg,#78b800,#00a3c4,#2e7bd6,var(--acc))}
.who{margin-top:14px;background:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--sh);max-width:964px;width:calc(100% - 36px)}
.who .av{border-radius:16px;width:50px;height:50px;background:linear-gradient(135deg,var(--accs),#fff);border:1px solid var(--line)}
.who h1{font-size:20px}
nav{position:sticky;top:0;z-index:6;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:10px 18px;margin-top:6px;background:rgba(245,248,252,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;flex:none;border-color:transparent;background:#fff;box-shadow:0 1px 3px rgba(28,55,104,.08);padding:8px 16px;color:#4b5b70}
nav button.on{box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 35%,transparent)}
main{padding-top:8px}
.card{border-radius:18px;border-color:var(--line);box-shadow:var(--sh);padding:14px 16px}
.sec h2,main h2{display:flex;align-items:center;gap:6px}
.sec p{color:var(--muted);font-size:13px;margin:0}
label.f{font-weight:500;color:#5b6b80}
label.f input,label.f select,label.f textarea,.mrow input,.more input{border-radius:12px;padding:9px 11px;border:1px solid #dfe6ef;background:#fbfdff;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.btn{border-radius:12px}
.task{border-inline-start:4px solid #dfe6ef}
.task.s-done{border-inline-start-color:#78b800}.task.s-doing{border-inline-start-color:#2e7bd6}.task.s-late{border-inline-start-color:#f2b33d}
.task .t{font-size:15.5px;color:#1f2f45}
.seg{border:0;background:#f1f5f9;border-radius:12px;padding:3px;gap:2px}
.seg button{border-radius:10px;background:transparent;padding:6px 14px;font-weight:700}
.seg button.on{box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on[data-s=todo],.seg button.on[data-k=todo]{background:#fff}
@media(max-width:700px){.task .seg{display:grid;grid-template-columns:repeat(3,1fr);width:100%}}
.tag.late{background:#fff4e0;color:#9a6200}
.note{border-radius:14px}
/* research details */
details.rd{padding:0;overflow:hidden}
details.rd summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
details.rd summary::-webkit-details-marker{display:none}
.rd .rn{width:34px;height:34px;border-radius:12px;background:var(--accs);color:var(--acc);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.rd .rx{flex:1;min-width:0}.rd .rx b{display:block;color:#1c3768;font-size:15px;line-height:1.4}.rd .rx small{color:var(--muted);font-size:12.5px}
.rd .chev{color:var(--muted);font-size:20px;transition:transform .2s}.rd[open] .chev{transform:rotate(180deg)}
.rdb{padding:0 16px 16px;border-top:1px solid var(--line)}
.grp{margin-top:14px;display:grid;gap:10px}.grp .gt{font-weight:800;color:#1c3768;font-size:14px}
.grp .agr{margin-top:0}
.stations span{height:6px}

.hd .l img{height:60px!important}.hd .c img{height:52px!important}
.sgl2{display:flex;flex-direction:column;gap:6px;margin:8px 0}.sgr{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid #e3eaf2;border-radius:12px;padding:6px 10px;font-size:13.5px}.sgr .sok{color:#2e8b57;font-size:12.5px}img[src^="data:image/gif;base64,R0lGOD"]{display:none!important}</style>

 if(e.target.id==='bk'){const files=[];for(const ev of S.evidence){const b=await getF(ev.id);if(b)files.push({id:ev.id,data:await toB64(b)})}download(`انطلاقة_نسخة_احتياطية_${today()}.json`,JSON.stringify({app:'intilaqa-v2-backup',role:ROLE,state:S,files}),'application/json');return}
 if(e.target.id==='rs'){restoring=true;$('#impIn').click();return}
 if(e.target.id==='csv'){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const L=[['العضو','المهمة','الموعد','الحالة','ملاحظة','عدد الأدلة'].map(q).join(',')];S.tasks.forEach(t=>L.push([nm(t.role),t.task,t.due,{done:'منجز',late:'متأخر',doing:'جارٍ',todo:'لم يبدأ'}[state(t)],t.note,evOf('t:'+t.id).length].map(q).join(',')));download(`انطلاقة_المهام_${today()}.csv`,'﻿'+L.join('\n'),'text/csv');return}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.matches('[data-note]')){const t=S.tasks.find(x=>x.id===el.closest('[data-t]').dataset.t);t.note=el.value;t.updated=today();save();return}
 if(el.dataset.stf){const st=S.students.find(x=>x.id===el.closest('[data-s]').dataset.s);const tk=st.tasks.find(x=>x.id===el.closest('[data-stt]').dataset.stt);tk[el.dataset.stf]=el.value;save();return}
 if(el.dataset.mi!==undefined){const r=S.research.find(x=>x.id===el.closest('[data-r]').dataset.r);const L=mArr(r).slice();L[+el.dataset.mi]=el.value.trim();r.mem=L;save();return}
 const holder=el.closest('[data-r],[data-a],[data-s]');if(holder&&el.dataset.f){const col=holder.dataset.r?'research':holder.dataset.a?'acts':'students';const id=holder.dataset.r||holder.dataset.a||holder.dataset.s;const x=S[col].find(y=>y.id===id);let v=el.value;if(el.dataset.n!==undefined)v=+v||0;x[el.dataset.f]=v;if(col==='research'&&el.dataset.f==='subNo'&&v&&x.station<5)x.station=5;save();return}
 const kr=el.closest('[data-k]');if(kr&&el.dataset.kf){S.kpi[kr.dataset.k]=S.kpi[kr.dataset.k]||{};S.kpi[kr.dataset.k][el.dataset.kf]=el.value.trim();save();return}
 const pr=el.closest('[data-p]');if(pr&&el.dataset.pf){const p=S.partners.find(x=>x.id===pr.dataset.p);p[el.dataset.pf]=el.type==='checkbox'?el.checked:el.value;save();return}
 if(el.id==='evFilter')renderEvidence();if(el.id==='allF')renderAll();
});
let pendingLink=null,pendingCat=null;
function askCat(){if(pendingCat){$('#fileIn').click();return}
 const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mbox"><b>ما نوع الدليل؟</b><div class="chips">${EV_CATS.map(c=>`<button class="btn light sm" data-cat="${c}">${c}</button>`).join('')}</div><button class="btn line sm" data-x style="margin-top:10px">إلغاء</button></div>`;
 document.body.appendChild(m);m.onclick=ev=>{const c=ev.target.closest('[data-cat]');if(c){pendingCat=c.dataset.cat;m.remove();$('#fileIn').click()}else if(ev.target.closest('[data-x]')||ev.target===m)m.remove()}}
$('#fileIn').onchange=async e=>{for(const f of e.target.files){const id=uid();await putF(id,f);S.evidence.push({id,role:ROLE,name:f.name,size:f.size,type:f.type,link:pendingLink,cat:pendingCat||'أخرى',added:today()})}if((pendingLink||'').startsWith('et:')){const r=S.research.find(x=>'et:'+x.id===pendingLink);if(r&&!ethOk(r))r.ethics='معتمدة'}e.target.value='';pendingCat=null;save()};

$('#stuIn').onchange=async e=>{const log=[];for(const f of e.target.files){try{const j=JSON.parse(await f.text());if(j.app!=='intilaqa-student'||!j.student)throw 0;const st=j.student;
  let x=S.students.find(y=>y.sid===st.sid)||S.students.find(y=>!y.sid&&y.name&&y.name.trim()===st.name.trim());const isNew=!x;
  if(!x){x={id:uid()};S.students.push(x)}Object.assign(x,{sid:st.sid,name:st.name,team:st.team,sem:st.sem,ava:st.ava,hours:st.hours,hoursLog:st.hoursLog||[],xp:st.xp,tasks:st.tasks||[],lastReport:j.month});
  for(const fl of j.files||[])await putF(fl.id,d2b(fl.data));let ne=0;
  for(const ev of st.evidence||[]){if(!S.evidence.some(y=>y.id===ev.id)){S.evidence.push({id:ev.id,role:'students',name:ev.name,size:ev.size,type:ev.type,link:'s:'+x.id,cat:'دليل طالب',added:ev.added||today()});ne++}}
  log.push(`${isNew?'🆕':'✓'} ${st.ava||'🎓'} ${st.name}: ${(st.tasks||[]).filter(t=>t.status==='done').length}/${(st.tasks||[]).length} مهمة · ${st.hours} ساعة · ${ne} دليل جديد`)}catch(err){log.push(`✗ ${f.name}: ليس ملف طالب صالحاً`)}}
 e.target.value='';save();if(log.some(l=>!l.startsWith('✗'))){confetti(150);toast('🎓 وصلت إنجازات الطلاب!')}const L=$('#stuLog');if(L)L.innerHTML=`<div class="log">${log.join('\n')}</div>`};

/* ---------- init ---------- */
$('#lP').src=LOGO_PROG;$('#lA').src=LOGO_ACC;$('#lC').src=LOGO_COB;
const R=ROLES[ROLE];$('#whoTitle').textContent=R.title+' · انطلاقة '+YR()+'هـ';window.__who=()=>{const n=nm(ROLE);$('#whoName').innerHTML=esc(n)+' <button id="editName" class="btn light sm" style="vertical-align:middle" aria-label="تعديل الاسم">✏️ اسمي</button>';$('#av').textContent=(n.replace(/^(أ|د|م)\.\s*/,'').charAt(0))||'؟'};

window.__init=()=>{try{load();nav();render()}catch(e){window.__showErr&&window.__showErr(e)}
openDB().then(()=>{try{if(!canStore)$('#storeWarn').classList.remove('hide');render()}catch(e){window.__showErr&&window.__showErr(e)}});};window.__rawRender=()=>render();if(window.SYNC)SYNC.boot();else __init();
</script>
