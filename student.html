<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* layout: one column app, hero card + mission list + badge shelf */
:root{color-scheme:light;--navy:#1c3768;--blue:#2e7bd6;--teal:#00a3c4;--green:#78b800;--gold:#e0a100;--ink:#26364a;--muted:#6b7a8c;--line:#e4eaf2;--bg:#f4f8fc;--card:#fff;--ok:#3e8c00;--oks:#eaf6db;--late:#c0392b}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6;margin:0}
button,input,select{font-family:inherit;font-size:15px}
.wrap{max-width:720px;margin:0 auto;padding-block:0 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:10px;max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header img{height:38px}header .c img{height:46px}header .l{justify-self:end}
.band{height:5px;background:linear-gradient(90deg,var(--green),var(--teal),var(--blue),var(--navy))}
h2{font-size:20px;color:var(--navy);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.btn{border:0;border-radius:14px;padding:11px 18px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}
.btn.t{background:var(--teal)}.btn.l{background:#eef3fa;color:var(--navy)}.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.big{display:block;width:100%;padding:15px;font-size:18px}
.btn:focus-visible,.seg button:focus-visible,.av button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
label.f{display:block;font-size:13px;color:var(--muted);margin-top:10px}
label.f input,label.f select{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--ink)}
.av{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
.av button{font-size:26px;border:2px solid var(--line);border-radius:14px;background:#fff;padding:4px;cursor:pointer}
.av button.on{border-color:var(--teal);background:#e3f6fa}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 100% at 90% 0%,#2a4d86,#1c3768 60%,#152a52);color:#fff;border-radius:26px;padding:18px;margin-top:14px;box-shadow:0 14px 32px rgba(28,55,104,.22)}
.hero:after{content:"";position:absolute;width:200px;height:200px;left:-70px;bottom:-90px;background:radial-gradient(circle,rgba(120,184,0,.45),transparent 70%)}
.me{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.me .ava{font-size:46px;width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.me h1{margin:0;font-size:22px}.me p{margin:0;color:#c9d6ea;font-size:14px}
.lvl{position:relative;z-index:1;margin-top:14px}
.lvl .row{display:flex;justify-content:space-between;font-weight:800}
.lvl .row span:last-child{color:#c9d6ea;font-weight:500;font-size:13px}
.xp{height:14px;border-radius:10px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
.xp i{display:block;height:100%;border-radius:10px;background:linear-gradient(270deg,var(--green),var(--teal));transition:width .7s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.stats div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:12px;color:#c9d6ea}
.msn{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 0;border-bottom:1px dashed var(--line)}
.msn:last-child{border:0}
.msn .ic{font-size:28px;width:48px;height:48px;border-radius:14px;background:#eef3fa;display:flex;align-items:center;justify-content:center}
.msn.done .ic{background:var(--oks)}
.msn .t{font-weight:800}
.msn .x{font-size:12px;color:var(--gold);font-weight:800}
.msn input.ed{width:100%;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.msn .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button.on[data-k=todo]{background:#eef1f5;color:var(--ink)}.seg button.on[data-k=doing]{background:#e6f1fc;color:#1b5fae}.seg button.on[data-k=done]{background:var(--oks);color:var(--ok)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center}
.bd .e{font-size:34px}.bd b{display:block;font-size:14px}.bd span{font-size:11.5px;color:var(--muted)}
.bd.off{opacity:.38;filter:grayscale(1)}
.bd.on{border-color:#f0d58a;background:linear-gradient(180deg,#fffaf0,#fff)}
.hrs{display:grid;grid-template-columns:1fr 90px 120px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hrs:last-child{border:0}
@media(max-width:520px){.hrs{grid-template-columns:1fr 70px auto}.hrs .d{display:none}.badges{grid-template-columns:repeat(3,1fr)}.av{grid-template-columns:repeat(6,1fr)}}
.hrs input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px}
.note{background:#e3f6fa;border-radius:14px;padding:10px 14px;font-size:14px;margin-top:10px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(30px);background:#fff;border:2px solid var(--teal);color:var(--navy);padding:12px 20px;border-radius:30px;box-shadow:0 10px 30px rgba(28,55,104,.18);font-weight:800;opacity:0;transition:.35s;z-index:20;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:19}
.modal{position:fixed;inset:0;background:rgba(20,30,50,.35);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.mbox{background:#fff;border-radius:18px;padding:18px;max-width:460px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
@media(prefers-reduced-motion:reduce){.me .ava{animation:none}.xp i{transition:none}}
</style>

let S;const KEY='intilaqa_student';
function seed(){return {sid:uid(),name:'',team:TEAMS[0],sem:'الأول',ava:'🦊',tasks:MISSIONS.map(([i,t])=>({id:uid(),ic:i,task:t,due:'',status:'todo'})),hours:[],evidence:[],setup:false}}
function load(){try{const x=localStorage.getItem(KEY);S=x?JSON.parse(x):seed()}catch(e){S=seed()}}

let DB=null;const mem={};
function openDB(){return new Promise(r=>{setTimeout(r,1500);try{const q=indexedDB.open('intilaqa_student_files',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>{DB=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
const putF=(id,b)=>new Promise(r=>{if(!DB){mem[id]=b;return r()}const t=DB.transaction('f','readwrite');t.objectStore('f').put(b,id);t.oncomplete=r;t.onerror=()=>{mem[id]=b;r()}});
const getF=id=>new Promise(r=>{if(mem[id])return r(mem[id]);if(!DB)return r(null);const q=DB.transaction('f').objectStore('f').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
const toB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function d2b(u){const [h,b]=u.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
let DLCAP=null;
async function download(name,data){const blob=data instanceof Blob?data:new Blob([data],{type:'application/json'});if(!DLCAP&&/\.json$/i.test(name)&&navigator.canShare){try{const fl=new File([blob],name,{type:'application/json'});if(navigator.canShare({files:[fl]})){await navigator.share({files:[fl],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return false}}if(DLCAP){try{await DLCAP.save({filename:name,data:blob});return true}catch(e){if(!e||e.code!=='declined')toast('تعذّر الحفظ هنا، جرّب من متصفح الكمبيوتر');return false}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return true}
let tT;function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),3200)}
function confetti(n=140){let c=$('#fx');if(!c){c=document.createElement('canvas');c.id='fx';document.body.appendChild(c)}const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#78b800','#00a3c4','#2e7bd6','#1c3768','#e0a100','#8a6fd1'];const P=[...Array(n)].map(()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,s:Math.random()*7+4,c:pick(cols),r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}

const doneN=()=>S.tasks.filter(t=>t.status==='done').length;
const hoursN=()=>S.hours.reduce((p,h)=>p+(+h.h||0),0);
const xp=()=>doneN()*20+Math.round(hoursN()*3)+Math.min(S.evidence.length,10)*5;
function lvl(){const p=xp();let i=0;LEVELS.forEach((l,k)=>{if(p>=l[0])i=k});const cur=LEVELS[i],nx=LEVELS[i+1];return {cur,nx,p,pct:nx?Math.round((p-cur[0])/(nx[0]-cur[0])*100):100}}
function badges(){const d=doneN(),h=hoursN(),ev=S.evidence.length;return [
 ['🎟️','أول خطوة','أنجز أول مهمة',d>=1],['📸','الموثّق','ارفع أول دليل',ev>=1],['⏱️','10 ساعات','10 ساعات تطوع',h>=10],

  <div class="ctl"><div class="seg">${[['todo','لم أبدأ'],['doing','أشتغل عليها'],['done','خلصت']].map(([k,n])=>`<button data-k="${k}" class="${t.status===k?'on':''}">${n}</button>`).join('')}</div><button class="btn l sm" data-up="${t.id}">📸 دليل</button>${t.custom?'<button class="btn l sm" data-del>✕</button>':''}</div></div></div>`).join('')}
  <div style="margin-top:10px"><button class="btn l sm" id="addT">+ مهمة كلّفني بها المشرف</button></div></div>

 <h2>⏱️ ساعات التطوع</h2><div class="card">${S.hours.map(h=>`<div class="hrs" data-h="${h.id}"><input data-hf="what" value="${esc(h.what)}" placeholder="ماذا عملت؟"><input type="number" min="0" step="0.5" data-hf="h" value="${h.h}" aria-label="الساعات"><input class="d" type="date" data-hf="date" value="${h.date}" aria-label="التاريخ"><button class="btn l sm" data-hdel>✕</button></div>`).join('')||'<div style="color:var(--muted)">سجّل كل مرة تطوعت فيها… كل ساعة = 3 نقاط ⏳</div>'}
  <div style="margin-top:10px"><button class="btn l sm" id="addH">+ إضافة ساعات</button></div></div>

 <h2>🏅 أوسمتي <span style="font-size:14px;color:var(--muted)">(${got} من ${B.length})</span></h2><div class="badges">${B.map(b=>`<div class="bd ${b[3]?'on':'off'}"><div class="e">${b[0]}</div><b>${b[1]}</b><span>${b[2]}</span></div>`).join('')}</div>

 <h2>📤 أرسل إنجازي لأ. عبدالعزيز</h2><div class="card"><p style="margin-top:0">في آخر كل شهر اضغط الزر، ثم أرسل الملف لمسؤول «باحث المستقبل» بالواتساب أو البريد. كذا يظهر اسمك في «نجوم انطلاقة» على شاشات الكلية ⭐</p>
  <button class="btn big t" id="send">📤 جهّز تقرير ${monthName(monthKey())}</button>${S.lastSent?`<div style="color:var(--muted);font-size:13px;margin-top:6px">آخر إرسال: ${fd(S.lastSent)}</div>`:''}</div>
 <div class="note">💾 بياناتك محفوظة في هذا المتصفح. <button class="btn l sm" id="bk">نسخة احتياطية</button> <button class="btn l sm" id="rs">استعادة</button> <button class="btn l sm" id="edit">تعديل بياناتي</button></div>`}

function renderSetup(){$('#app').innerHTML=`<div class="hero" style="text-align:center"><div style="font-size:54px">🚀</div><h1 style="margin:4px 0;font-size:24px;position:relative;z-index:1">أهلاً بك في «باحث المستقبل»</h1><p style="color:#c9d6ea;margin:0;position:relative;z-index:1">برنامج انطلاقة · قسم نظم المعلومات الإدارية</p></div>
 <div class="card" style="margin-top:14px"><label class="f">اسمك الكامل<input id="nm" value="${esc(S.name)}" placeholder="مثال: سارة الغامدي"></label>
 <label class="f">فريقك أو مشروعك<select id="tm">${TEAMS.map(t=>`<option ${t===S.team?'selected':''}>${t}</option>`).join('')}</select></label>
 <label class="f">الفصل<select id="sm"><option ${S.sem==='الأول'?'selected':''}>الأول</option><option ${S.sem==='الثاني'?'selected':''}>الثاني</option></select></label>
 <div class="f" style="font-size:13px;color:var(--muted);margin-top:10px">اختر شخصيتك</div><div class="av">${AVATARS.map(a=>`<button data-av="${a}" class="${a===S.ava?'on':''}" aria-label="${a}">${a}</button>`).join('')}</div>
 <button class="btn big" id="go" style="margin-top:16px">انطلق! 🚀</button></div>`}

/* ---------- events ---------- */
let upFor=null;
document.addEventListener('click',async e=>{
 const av=e.target.closest('[data-av]');if(av){S.ava=av.dataset.av;document.querySelectorAll('[data-av]').forEach(b=>b.classList.toggle('on',b===av));return}
 if(e.target.id==='go'){const n=$('#nm').value.trim();if(!n){toast('اكتب اسمك أولاً ✍️');return}S.name=n;S.team=$('#tm').value;S.sem=$('#sm').value;S.setup=true;save();confetti();toast('مرحباً بالبطل! أول مهمة تنتظرك 🎯');return}
 if(e.target.id==='edit'){S.setup=false;render();return}
 const sg=e.target.closest('.seg button');if(sg){const t=S.tasks.find(x=>x.id===sg.closest('[data-t]').dataset.t);const was=t.status,before=lvl().cur;t.status=sg.dataset.k;save();
  if(t.status==='done'&&was!=='done'){const after=lvl().cur;if(after!==before){confetti(260);toast(`🆙 مستوى جديد: ${after[1]} ${after[2]}!`)}else if(S.tasks.every(x=>x.status==='done')){confetti(260);toast('🏆 أنهيت كل المهام! أنت أسطورة انطلاقة')}else{confetti();toast(pick(CHEERS))}}else if(t.status==='doing'&&was==='todo')toast('يلا! 🚀 بالتوفيق');return}
 const up=e.target.closest('[data-up]');if(up){upFor=up.dataset.up;$('#fIn').click();return}
 if(e.target.closest('[data-del]')){S.tasks=S.tasks.filter(x=>x.id!==e.target.closest('[data-t]').dataset.t);save();return}
 if(e.target.id==='addT'){S.tasks.push({id:uid(),ic:'⭐',task:'',due:'',status:'todo',custom:true});save();return}
 if(e.target.id==='addH'){S.hours.push({id:uid(),what:'',h:1,date:today()});save();return}
 if(e.target.closest('[data-hdel]')){S.hours=S.hours.filter(x=>x.id!==e.target.closest('[data-h]').dataset.h);save();return}
 if(e.target.id==='send'){const files=[];for(const ev of S.evidence){const b=await getF(ev.id);if(b)files.push({id:ev.id,data:await toB64(b)})}
  const rep={app:'intilaqa-student',month:monthKey(),exported:today(),student:{sid:S.sid,name:S.name,team:S.team,sem:S.sem,ava:S.ava,hours:hoursN(),xp:xp(),tasks:S.tasks.map(t=>({id:t.id,task:t.task,due:t.due,status:t.status})),evidence:S.evidence},files};
  const ok=await download(`انطلاقة_طالب_${S.name.replace(/\s+/g,'_')}_${monthName(monthKey()).replace(' ','_')}.json`,JSON.stringify(rep));if(ok){S.lastSent=today();save();confetti(140);toast('📨 جاهز! أرسله الآن لأ. عبدالعزيز 🎉')}return}
 if(e.target.id==='bk'){const files=[];for(const ev of S.evidence){const b=await getF(ev.id);if(b)files.push({id:ev.id,data:await toB64(b)})}download(`انطلاقة_طالب_نسخة_احتياطية_${today()}.json`,JSON.stringify({app:'intilaqa-student-backup',state:S,files}));return}
 if(e.target.id==='rs'){$('#bIn').click();return}
});
document.addEventListener('change',async e=>{const el=e.target;
 if(el.dataset.tf){const t=S.tasks.find(x=>x.id===el.closest('[data-t]').dataset.t);t[el.dataset.tf]=el.value;save();return}
 if(el.dataset.hf){const h=S.hours.find(x=>x.id===el.closest('[data-h]').dataset.h);const was=hoursN();h[el.dataset.hf]=el.dataset.hf==='h'?(+el.value||0):el.value;save();if(was<10&&hoursN()>=10){confetti();toast('⏱️ وسام «10 ساعات» صار لك!')}return}
 if(el.id==='fIn'){for(const f of el.files){const id=uid();await putF(id,f);S.evidence.push({id,name:f.name,size:f.size,type:f.type,link:upFor,added:today()})}el.value='';const first=S.evidence.length===1;save();toast(first?'📸 وسام «الموثّق» صار لك!':'📎 تم حفظ الدليل');if(first)confetti();return}
 if(el.id==='bIn'){const f=el.files[0];el.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='intilaqa-student-backup')throw 0;for(const x of j.files||[])await putF(x.id,d2b(x.data));S=j.state;save();toast('✓ تمت الاستعادة')}catch(err){toast('الملف ليس نسخة احتياطية لهذه الصفحة')}}
});
$('#lP').src=LOGO_PROG;$('#lA').src=LOGO_ACC;$('#lC').src=LOGO_COB;
try{load();render()}catch(e){window.__showErr&&window.__showErr(e)}
openDB();
</script>
